services:
  alerty:
    build: .
    container_name: alerty
    restart: unless-stopped
    environment:
      PORT: 8080
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      PROMETHEUS_TOKEN: ${PROMETHEUS_TOKEN:-}
      PROMETHEUS_USER: ${PROMETHEUS_USER:-}
      PROMETHEUS_PASSWORD: ${PROMETHEUS_PASSWORD:-}
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
      LOKI_TOKEN: ${LOKI_TOKEN:-}
      LOKI_USER: ${LOKI_USER:-}
      LOKI_PASSWORD: ${LOKI_PASSWORD:-}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-8000}
    ports:
      - "127.0.0.1:${ALERTY_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  prometheus:
    image: prom/prometheus:v3.13.3
    container_name: alerty-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    security_opt:
      - no-new-privileges:true

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: alerty-node-exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    expose:
      - "9100"
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  alloy:
    image: grafana/alloy:v1.21.3
    container_name: alerty-alloy
    restart: unless-stopped
    user: "0:0"
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy-ubuntu-101.alloy:/etc/alloy/config.alloy:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - alloy-data:/var/lib/alloy
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  loki:
    image: grafana/loki:3.7.0
    container_name: alerty-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    security_opt:
      - no-new-privileges:true

volumes:
  alloy-data:
  prometheus-data:
  loki-data:
